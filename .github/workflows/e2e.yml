name: E2E Tests

on:
  push:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # E2E tests skip via Assumptions when FFmpeg is missing, so a broken
      # install would leave the job green while testing nothing.
      - name: Verify FFmpeg is on PATH
        run: ffmpeg -version

      - name: Run E2E tests
        run: mvn -B verify
