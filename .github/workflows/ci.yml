name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # package runs surefire (unit tests + ArchUnit); **/e2e/** is excluded by the pom
      - name: Build and test
        run: mvn -B package

      - uses: actions/upload-artifact@v4
        with:
          name: theatrum-jar
          path: target/theatrum-*.jar

  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: theatrum-jar

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          body: Automated build from the latest push to main. Requires Java 25 and FFmpeg on PATH.
          make_latest: true
          files: theatrum-*.jar
