<!doctype html>
<meta charset="utf-8">
<title>Theatrum — streams</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font: 14px/1.5 system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
  video { width: 100%; background: #000; aspect-ratio: 16/9; }
  fieldset { border: 1px solid #ccc; margin: 0 0 1rem; }
  button, select, input { font: inherit; padding: .3rem .8rem; }
  button, select { cursor: pointer; }
  #list button { margin: .1rem .2rem .1rem 0; }
  #url { width: 100%; margin: .5rem 0; }
  #status { color: #a00; min-height: 1.5em; }
</style>

<h1>Theatrum streams</h1>
<p><button id="refresh">refresh</button></p>

<div id="list"></div>

<p>
  <label>quality <select id="quality" disabled></select></label>
</p>
<input id="url" placeholder="/watch/demo/master.m3u8">
<video id="video" controls autoplay muted></video>
<p id="status"></p>

<!-- hls.js first: it exposes the variant levels, which native HLS does not. -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<script>
  const PLAYLIST = '/all_streams.m3u8';
  const list = document.getElementById('list');
  const video = document.getElementById('video');
  const quality = document.getElementById('quality');
  const url = document.getElementById('url');
  const status = document.getElementById('status');
  let hls;

  async function load() {
    list.textContent = 'loading…';
    let text;
    try {
      const res = await fetch(PLAYLIST, { cache: 'no-store' });
      if (!res.ok) throw new Error(res.status + ' ' + res.statusText);
      text = await res.text();
    } catch (e) {
      list.textContent = 'cannot read ' + PLAYLIST + ': ' + e.message
        + ' — is application.all_streams_playlist enabled?';
      return;
    }
    // The playlist advertises public_path; play through the current origin instead, so a
    // public_path pointing at a proxy does not turn every request cross-origin.
    render(text.split('\n')
      .map(l => l.trim())
      .filter(l => l && !l.startsWith('#'))
      .map(u => new URL(u, location.href).pathname));
  }

  /** Groups by the channel prefix — the first path segment of /vod/…, /live/…, /watch/… */
  function render(paths) {
    list.replaceChildren();
    if (!paths.length) {
      list.textContent = 'no stream found';
      return;
    }
    const groups = new Map();
    for (const path of paths) {
      const type = '/' + path.split('/')[1];
      if (!groups.has(type)) groups.set(type, []);
      groups.get(type).push(path);
    }

    for (const [type, urls] of groups) {
      const group = document.createElement('fieldset');
      const legend = document.createElement('legend');
      legend.textContent = type + ' (' + urls.length + ')';
      group.append(legend);
      for (const streamUrl of urls) {
        const button = document.createElement('button');
        button.textContent = streamUrl.replace(/^\/[^/]+\//, '').replace(/\/master\.m3u8$/, '');
        button.onclick = () => play(streamUrl);
        group.append(button);
      }
      list.append(group);
    }
  }

  function play(src) {
    status.textContent = '';
    url.value = src;
    quality.replaceChildren();
    quality.disabled = true;
    if (hls) { hls.destroy(); hls = null; }

    if (window.Hls && Hls.isSupported()) {
      hls = new Hls();
      hls.on(Hls.Events.MANIFEST_PARSED, fillQualities);
      hls.on(Hls.Events.LEVEL_SWITCHED, (_, d) => showAutoLevel(d.level));
      hls.on(Hls.Events.ERROR, (_, d) => { if (d.fatal) status.textContent = d.details; });
      hls.loadSource(src);
      hls.attachMedia(video);
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      // Safari picks the variant itself and exposes no handle on it.
      video.src = src;
      quality.append(new Option('auto (native)'));
    } else {
      status.textContent = 'No HLS support in this browser.';
      return;
    }
    video.play().catch(() => {});
  }

  function fillQualities() {
    quality.replaceChildren(new Option('auto', 'auto'));
    hls.levels.forEach((level, i) => quality.append(new Option(label(level), i)));
    quality.disabled = false;
  }

  function showAutoLevel(i) {
    if (quality.value === 'auto' && hls.levels[i]) {
      quality.options[0].textContent = 'auto — ' + label(hls.levels[i]);
    }
  }

  /** FFmpeg writes no NAME attribute, so the quality name comes from its playlist directory. */
  function label(level) {
    const name = level.url?.[0] ? new URL(level.url[0], location.href).pathname.split('/').at(-2) : '';
    return [name, level.height && level.height + 'p', level.bitrate && Math.round(level.bitrate / 1000) + 'k']
      .filter(Boolean).join(' · ');
  }

  quality.onchange = () => {
    if (hls) hls.currentLevel = quality.value === 'auto' ? -1 : Number(quality.value);
  };
  url.onchange = () => play(url.value);
  document.getElementById('refresh').onclick = load;
  load();
</script>
