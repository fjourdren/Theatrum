spring.application.name=theatrum
spring.main.banner-mode=off

# The HTTP port comes from config.yml, injected as a default property before the context refreshes.
# Do not set server.port here: application.properties outranks default properties and would win.
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{0} - %msg%n
